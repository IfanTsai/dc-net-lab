# Codegen config: `buf generate` (or `make api`) writes the generated
# Go code to pb/, kept separate from the .proto sources under api/.
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pb
    opt: paths=source_relative
  - local: protoc-gen-go-http
    out: pb
    opt: paths=source_relative
