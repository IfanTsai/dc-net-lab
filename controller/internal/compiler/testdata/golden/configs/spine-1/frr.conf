frr defaults datacenter
hostname spine-1
service integrated-vtysh-config
!
interface lo
 ip address 10.1.0.0/32
!
interface eth1
 description to leaf-a
 ip address 10.0.0.0/31
!
interface eth2
 description to leaf-b
 ip address 10.0.0.2/31
!
router bgp 65200
 bgp router-id 10.1.0.0
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 4200080001
 neighbor 10.0.0.1 description leaf-a
 neighbor 10.0.0.3 remote-as 4200080001
 neighbor 10.0.0.3 description leaf-b
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 64
 exit-address-family
!
line vty
!
