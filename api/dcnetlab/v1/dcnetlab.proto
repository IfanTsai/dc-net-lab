// DCNetLab controller API. The protobuf definition is the single
// source of truth for the REST surface; HTTP bindings are declared
// with google.api.http annotations and served by Kratos. JSON field
// names follow the protojson camelCase mapping, which matches the
// original hand-written REST API consumed by the web UI.
syntax = "proto3";

package dcnetlab.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ifantsai/dcnetlab/pb/dcnetlab/v1;v1";

// DCNetLab is the controller service: lab lifecycle, plan/apply,
// topology queries and async operation tracking.
service DCNetLab {
  // --- Labs ---
  rpc CreateLab(CreateLabRequest) returns (Lab) {
    option (google.api.http) = {
      post: "/api/v1/labs"
      body: "*"
    };
  }
  rpc ListLabs(ListLabsRequest) returns (ListLabsReply) {
    option (google.api.http) = {get: "/api/v1/labs"};
  }
  rpc GetLab(GetLabRequest) returns (Lab) {
    option (google.api.http) = {get: "/api/v1/labs/{id}"};
  }
  rpc DeleteLab(DeleteLabRequest) returns (OperationRef) {
    option (google.api.http) = {delete: "/api/v1/labs/{id}"};
  }
  // StartLab / StopLab power the deployed containers of a lab on and
  // off (docker start/stop) without touching the generation.
  rpc StartLab(StartLabRequest) returns (OperationRef) {
    option (google.api.http) = {
      post: "/api/v1/labs/{id}/start"
      body: "*"
    };
  }
  rpc StopLab(StopLabRequest) returns (OperationRef) {
    option (google.api.http) = {
      post: "/api/v1/labs/{id}/stop"
      body: "*"
    };
  }
  // RepairLab re-attaches any simulated interfaces the runtime lost
  // (e.g. a host Docker daemon restart dropping veth pairs) without
  // going through Plan/Apply: it re-runs the same idempotent deploy
  // against the lab's current generation, so already-running
  // containers and their programs are left untouched.
  rpc RepairLab(RepairLabRequest) returns (OperationRef) {
    option (google.api.http) = {
      post: "/api/v1/labs/{id}/repair"
      body: "*"
    };
  }
  // UpdateLabTopology changes the desired fabric shape (scale out /
  // scale in). It only edits the spec: the change materialises through
  // the regular Plan (diff preview) / Apply (incremental deploy) flow.
  rpc UpdateLabTopology(UpdateLabTopologyRequest) returns (Lab) {
    option (google.api.http) = {
      put: "/api/v1/labs/{lab_id}/topology"
      body: "*"
    };
  }
  // RollbackLab creates a plan whose desired state is a retained
  // generation snapshot. The returned plan previews the diff like any
  // other and is applied through ApplyPlan; generation numbers keep
  // increasing (roll-forward to old content).
  rpc RollbackLab(RollbackLabRequest) returns (Plan) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/rollback"
      body: "*"
    };
  }

  // --- Topology ---
  rpc ListNodes(ListNodesRequest) returns (ListNodesReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes"};
  }
  rpc ListLinks(ListLinksRequest) returns (ListLinksReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/links"};
  }
  rpc ListAllocations(ListAllocationsRequest) returns (ListAllocationsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/allocations"};
  }
  // StartNode / StopNode power a single device on and off.
  rpc StartNode(StartNodeRequest) returns (Node) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/nodes/{node_id}/start"
      body: "*"
    };
  }
  rpc StopNode(StopNodeRequest) returns (Node) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/nodes/{node_id}/stop"
      body: "*"
    };
  }
  // GetNodeRuntime returns the management view of one deployed node:
  // the underlying container state and every kernel interface inside
  // it, including implementation plumbing (bridge, VRRP macvlan,
  // management eth0) that the simulated topology does not model.
  rpc GetNodeRuntime(GetNodeRuntimeRequest) returns (NodeRuntime) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/runtime"};
  }
  // GetNodeBGP returns the BGP configuration of one node as derived
  // by the FRR compiler from the topology model: eBGP neighbors over
  // fabric links, the MLAG iBGP session and the leaf's dynamic server
  // peer-group. Empty for nodes that do not run BGP.
  rpc GetNodeBGP(GetNodeBGPRequest) returns (NodeBGP) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/bgp"};
  }
  // GetNodeRoutes returns the live IPv4 routing table (FRR RIB) of
  // one deployed node; routes are empty unless the container is
  // running.
  rpc GetNodeRoutes(GetNodeRoutesRequest) returns (NodeRoutes) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/routes"};
  }
  // GetNodeBGPTable returns the live BGP Loc-RIB of one deployed
  // node (`show ip bgp`): every candidate path per prefix, before
  // best-path selection reduces them to the RIB entry.
  rpc GetNodeBGPTable(GetNodeBGPTableRequest) returns (NodeBGPTable) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/bgp-table"};
  }
  // GetNodeFIB returns the live kernel forwarding table of one
  // deployed node (`ip route`): what actually forwards packets, as
  // installed by zebra from the RIB.
  rpc GetNodeFIB(GetNodeFIBRequest) returns (NodeFIB) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/fib"};
  }
  // GetNodeMTR runs a one-shot mtr diagnostic probe from a deployed
  // node toward a target (another lab node or an arbitrary
  // address/hostname), reporting per-hop loss/latency statistics.
  // Hops whose address is known to the lab's model resolve back to a
  // node, letting the UI highlight the measured path on the topology
  // graph.
  rpc GetNodeMTR(GetNodeMTRRequest) returns (NodeMTR) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/mtr"};
  }
  // ScanMTRPaths repeats an mtr probe several times to sample
  // different ECMP branches: each run is a fresh process, so tcp/udp
  // naturally gets a new ephemeral source port per run — the same
  // 5-tuple hashing a real flow would use — varying which ECMP branch
  // the fabric picks. Distinct paths are grouped with how many
  // samples measured each one. icmp is rejected: it carries no port,
  // so every run would hash to the same branch.
  rpc ScanMTRPaths(ScanMTRPathsRequest) returns (MTRPathScan) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/mtr/scan"};
  }
  // GetNodeMetrics samples resource usage of one server live from
  // its agent, node-exporter style: CPU, memory, load, filesystem,
  // disk I/O and per-interface network.
  rpc GetNodeMetrics(GetNodeMetricsRequest) returns (NodeMetrics) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/metrics"};
  }
  // GetNodeMetricsHistory returns the collected resource-usage time
  // series of one server: 15 s points from the controller's metrics
  // collector, kept 2 h in memory and 24 h on disk.
  rpc GetNodeMetricsHistory(GetNodeMetricsHistoryRequest) returns (NodeMetricsHistory) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/metrics/history"};
  }

  // --- Packages ---
  // Packages are versioned program artifacts (tar.gz with a
  // manifest.json) in the controller's repository; lab servers
  // install them through their agent. The bundled lab-app registers
  // as the builtin package; uploads use the same pipeline.
  rpc UploadPackage(UploadPackageRequest) returns (Package) {
    option (google.api.http) = {
      post: "/api/v1/packages"
      body: "*"
    };
  }
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesReply) {
    option (google.api.http) = {get: "/api/v1/packages"};
  }
  rpc DeletePackage(DeletePackageRequest) returns (DeletePackageReply) {
    option (google.api.http) = {delete: "/api/v1/packages/{name}/{version}"};
  }
  // GetNodeInventory reports what is actually on one server, live
  // from its agent: installed package versions and every program
  // (controller-managed or created node-locally via the in-container
  // CLI).
  rpc GetNodeInventory(GetNodeInventoryRequest) returns (NodeInventory) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/inventory"};
  }
  // InstallPackage delivers a package version onto lab servers
  // without declaring a program — the "deploy a binary" path (apt
  // install without a service unit). Idempotent per server: agents
  // skip versions already present with the same digest.
  rpc InstallPackage(InstallPackageRequest) returns (InstallPackageReply) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/packages/{name}/{version}/install"
      body: "*"
    };
  }

  // --- Programs ---
  // Programs are supervised processes on lab servers, each running
  // the entrypoint of an installed Package version, managed through
  // the per-server dcnetlab-server-agent.
  rpc CreateProgram(CreateProgramRequest) returns (CreateProgramReply) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs"
      body: "*"
    };
  }
  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/programs"};
  }
  rpc StartProgram(ProgramOpRequest) returns (Program) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs/{id}/start"
      body: "*"
    };
  }
  rpc StopProgram(ProgramOpRequest) returns (Program) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs/{id}/stop"
      body: "*"
    };
  }
  rpc UpgradeProgram(UpgradeProgramRequest) returns (Program) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs/{id}/upgrade"
      body: "*"
    };
  }
  rpc DeleteProgram(ProgramOpRequest) returns (DeleteProgramReply) {
    option (google.api.http) = {delete: "/api/v1/labs/{lab_id}/programs/{id}"};
  }
  // BatchProgramOp starts, stops or deletes several programs at once
  // (op is start|stop|delete); each id is applied best-effort and its
  // outcome is reported, so one failure does not abort the rest.
  rpc BatchProgramOp(BatchProgramRequest) returns (BatchProgramReply) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs/batch"
      body: "*"
    };
  }
  rpc GetProgramLogs(GetProgramLogsRequest) returns (ProgramLogs) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/programs/{id}/logs"};
  }

  // --- Traffic ---
  // TrafficScenarios drive measurable traffic between two lab servers
  // through a pair of trafficgen Programs (server role on the
  // destination, client role on the source); the collector tails the
  // client's stat lines into rate/success-rate/latency metrics and
  // evaluates any configured assertions.
  rpc CreateTrafficScenario(CreateTrafficScenarioRequest) returns (TrafficScenario) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/traffic-scenarios"
      body: "*"
    };
  }
  rpc ListTrafficScenarios(ListTrafficScenariosRequest) returns (ListTrafficScenariosReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/traffic-scenarios"};
  }
  rpc StartTrafficScenario(TrafficScenarioOpRequest) returns (TrafficScenario) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/traffic-scenarios/{id}/start"
      body: "*"
    };
  }
  rpc StopTrafficScenario(TrafficScenarioOpRequest) returns (TrafficScenario) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/traffic-scenarios/{id}/stop"
      body: "*"
    };
  }
  rpc DeleteTrafficScenario(TrafficScenarioOpRequest) returns (DeleteTrafficScenarioReply) {
    option (google.api.http) = {delete: "/api/v1/labs/{lab_id}/traffic-scenarios/{id}"};
  }
  // GetTrafficScenarioHistory returns the collected metrics series of
  // one scenario: 5 s points kept in memory for up to one hour
  // (scenarios are short interactive experiments, not persisted
  // across a controller restart like server metrics).
  rpc GetTrafficScenarioHistory(GetTrafficScenarioHistoryRequest) returns (TrafficScenarioHistory) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/traffic-scenarios/{id}/history"};
  }

  // --- Fault ---
  // FaultScenarios inject and recover a controlled failure against a
  // node or a link: node-stop/node-restart reuse the same pause/
  // unpause power semantics as the topology page; link-down and
  // interface-down set the interface administratively down; impairment
  // shapes egress traffic with one netem qdisc (delay/jitter/loss/rate
  // combined, matching how netem itself works — there is only ever one
  // qdisc per interface). A target (node or link) allows at most one
  // applied scenario at a time.
  rpc CreateFaultScenario(CreateFaultScenarioRequest) returns (FaultScenario) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/fault-scenarios"
      body: "*"
    };
  }
  rpc ListFaultScenarios(ListFaultScenariosRequest) returns (ListFaultScenariosReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/fault-scenarios"};
  }
  rpc ApplyFaultScenario(FaultScenarioOpRequest) returns (FaultScenario) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/fault-scenarios/{id}/apply"
      body: "*"
    };
  }
  rpc RecoverFaultScenario(FaultScenarioOpRequest) returns (FaultScenario) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/fault-scenarios/{id}/recover"
      body: "*"
    };
  }
  rpc DeleteFaultScenario(FaultScenarioOpRequest) returns (DeleteFaultScenarioReply) {
    option (google.api.http) = {delete: "/api/v1/labs/{lab_id}/fault-scenarios/{id}"};
  }

  // --- Capture ---
  // CaptureSessions record packets on one modelled interface of a lab
  // node (a topology link endpoint or vlanif/bond0) into a pcapng
  // file, with per-packet metadata available live. A session starts
  // capturing on creation and ends by itself (duration or limit) or
  // via stop; the recording stays downloadable until the session is
  // deleted or expires. The pcapng download is a plain HTTP route
  // (GET /api/v1/labs/{lab_id}/captures/{id}/pcap) and live metadata
  // is also pushed on WS /ws/v1/labs/{lab_id}/captures/{id}.
  rpc CreateCaptureSession(CreateCaptureSessionRequest) returns (CaptureSession) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/captures"
      body: "*"
    };
  }
  rpc ListCaptureSessions(ListCaptureSessionsRequest) returns (ListCaptureSessionsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/captures"};
  }
  rpc GetCaptureSession(CaptureSessionOpRequest) returns (CaptureSession) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/captures/{id}"};
  }
  rpc StopCaptureSession(CaptureSessionOpRequest) returns (CaptureSession) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/captures/{id}/stop"
      body: "*"
    };
  }
  rpc DeleteCaptureSession(CaptureSessionOpRequest) returns (DeleteCaptureSessionReply) {
    option (google.api.http) = {delete: "/api/v1/labs/{lab_id}/captures/{id}"};
  }
  rpc ListCapturePackets(ListCapturePacketsRequest) returns (ListCapturePacketsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/captures/{id}/packets"};
  }
  rpc GetCapturePacket(GetCapturePacketRequest) returns (CapturePacketDetail) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/captures/{id}/packets/{index}"};
  }

  // --- Plans ---
  rpc CreatePlan(CreatePlanRequest) returns (Plan) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/plans"
      body: "*"
    };
  }
  rpc GetPlan(GetPlanRequest) returns (Plan) {
    option (google.api.http) = {get: "/api/v1/plans/{id}"};
  }
  rpc ApplyPlan(ApplyPlanRequest) returns (OperationRef) {
    option (google.api.http) = {
      post: "/api/v1/plans/{id}/apply"
      body: "*"
    };
  }

  // --- Operations & Generations ---
  rpc GetOperation(GetOperationRequest) returns (Operation) {
    option (google.api.http) = {get: "/api/v1/operations/{id}"};
  }
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/operations"};
  }
  rpc ListGenerations(ListGenerationsRequest) returns (ListGenerationsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/generations"};
  }

  // --- Profiles & health ---
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesReply) {
    option (google.api.http) = {get: "/api/v1/profiles"};
  }
  rpc Healthz(HealthzRequest) returns (HealthzReply) {
    option (google.api.http) = {get: "/api/v1/healthz"};
  }
}

// --- Common resource metadata ---

// ResourceError is a structured error attached to a resource status.
message ResourceError {
  string code = 1;
  string message = 2;
  google.protobuf.Timestamp time = 3;
}

// ResourceMeta is the common metadata embedded in every resource.
// Phase is the unified lifecycle: Pending, Planning, Applying,
// Running, Degraded, Failed, Stopping, Stopped, Deleting, Deleted.
message ResourceMeta {
  string id = 1;
  string name = 2;
  int64 generation = 3;
  int64 observed_generation = 4;
  string phase = 5;
  ResourceError last_error = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// --- Lab ---

// AddressPool declares one CIDR pool managed by the IPAM allocator.
message AddressPool {
  string name = 1;
  string cidr = 2;
  int32 allocation_prefix = 3;
}

// ASNRange declares a contiguous ASN range for one device role.
message ASNRange {
  string role = 1;
  uint32 start = 2;
  uint32 end = 3;
}

// PodSpec describes one pod: leaves come in racks, each rack is one
// MLAG pair of leaf switches plus its servers.
message PodSpec {
  string name = 1;
  int32 spines = 2;
  int32 racks = 3;
  int32 servers_per_rack = 4;
}

// TopologySpec describes the desired fabric shape.
message TopologySpec {
  int32 external_routers = 1;
  int32 dc_edges = 2;
  int32 super_spines = 3;
  repeated PodSpec pods = 4;
  // InternetAccess connects the fabric to the real internet: dc-edges
  // NAT at the DC boundary, externals attach to a host-side WAN
  // network and originate a default route. Off = air-gapped DC.
  bool internet_access = 5;
}

message LabSpec {
  string profile = 1;
  TopologySpec topology = 2;
  repeated AddressPool pools = 3;
  repeated ASNRange asns = 4;
}

message LabStatus {
  int32 node_count = 1;
  int32 link_count = 2;
}

// Lab is the top-level resource holding one simulated data center.
message Lab {
  ResourceMeta meta = 1;
  LabSpec spec = 2;
  LabStatus status = 3;
}

// --- Node ---

// NodeSpec is the desired state of a node. Addresses are CIDR or IP
// strings; empty means unset.
message NodeSpec {
  string lab_id = 1;
  string role = 2;
  string pod_id = 3;
  string rack_id = 4;
  uint32 asn = 5;
  string loopback = 6;
  string mgmt_ip = 7;
  string runtime_type = 8;

  // Leaf-only: MLAG pair member acting as the VRRP active-active
  // gateway of the rack's server VLAN.
  string mlag_peer = 9;
  int32 vlan_id = 10;
  string vlan_ip = 11;
  string gateway_ip = 12;
  string gateway_mac = 13;
  int32 vrrp_group = 14;
  int32 vrrp_priority = 15;

  // Server-only: bond0 address, virtual gateway and the physical
  // VlanIPs of the two MLAG leaves as BGP peers.
  string address = 16;
  string default_gateway = 17;
  repeated string bgp_peers = 18;
}

// InterfaceStatus is one simulated interface's observed state.
// missing is true when the kernel has no such interface at all (e.g.
// its veth pair was lost to a container restart) as opposed to being
// present but administratively/operationally down — a distinction a
// fault injection never produces, since faults only ever toggle an
// existing interface's state.
message InterfaceStatus {
  string name = 1;
  bool up = 2;
  bool missing = 3;
}

// NodeStatus is the observed state of a node, filled by the observer.
// Interface counts and the interface list cover only the simulated
// objects: topology link endpoints plus modeled logical interfaces
// (the gateway vlanif on leaves, bond0 on servers).
message NodeStatus {
  string runtime_state = 1;
  string container_id = 2;
  int32 route_count = 3;
  int32 bgp_established = 4;
  int32 bgp_configured = 5;
  int32 interfaces_up = 6;
  int32 interfaces_total = 7;
  google.protobuf.Timestamp last_observed = 8;
  // vrrp_state is the VRRP gateway role of a leaf: Master, Backup or
  // empty for nodes without VRRP.
  string vrrp_state = 9;
  repeated InterfaceStatus interfaces = 10;
  // agent_state is the node-agent reachability of a running server as
  // probed by the observer: Up, Down, or empty for non-servers or
  // before the first probe.
  string agent_state = 11;
}

// Node is one device in the fabric: router, switch or server.
message Node {
  ResourceMeta meta = 1;
  NodeSpec spec = 2;
  NodeStatus status = 3;
}

// --- Link ---

// LinkEndpoint is one side of a point-to-point link.
message LinkEndpoint {
  string node_id = 1;
  string node_name = 2;
  string interface = 3;
  string address = 4;
}

// LinkSpec is the desired state of a link. Kind is fabric,
// server-access or mlag-peer; L2 links carry no endpoint addresses.
message LinkSpec {
  string lab_id = 1;
  string kind = 2;
  int32 vlan_id = 3;
  LinkEndpoint endpoint_a = 4;
  LinkEndpoint endpoint_b = 5;
  int32 mtu = 6;
}

message LinkStatus {
  bool admin_up = 1;
  bool oper_up = 2;
}

// Link is a point-to-point link between two nodes.
message Link {
  ResourceMeta meta = 1;
  LinkSpec spec = 2;
  LinkStatus status = 3;
}

// --- Package ---

// Package is one versioned program artifact in the controller's
// repository.
message Package {
  ResourceMeta meta = 1;
  string version = 2;
  // format is targz (the only supported format for now).
  string format = 3;
  // entrypoint is the executable inside the archive, relative to its
  // root.
  string entrypoint = 4;
  string description = 5;
  string sha256 = 6;
  int64 size_bytes = 7;
  // builtin packages ship with the controller and cannot be deleted.
  bool builtin = 8;
}

message UploadPackageRequest {
  // payload is the tar.gz archive; identity comes from its embedded
  // manifest.json (name, version, entrypoint, description).
  bytes payload = 1;
}

message ListPackagesRequest {}

message ListPackagesReply {
  repeated Package packages = 1;
}

message DeletePackageRequest {
  string name = 1;
  string version = 2;
}

message DeletePackageReply {}

message InstallPackageRequest {
  string lab_id = 1;
  string name = 2;
  string version = 3;
  // server_ids narrows the delivery; empty installs on every server
  // of the lab.
  repeated string server_ids = 4;
}

// ServerInstallResult is the per-server outcome of a package
// delivery; error is empty on success.
message ServerInstallResult {
  string server_id = 1;
  string server_name = 2;
  string error = 3;
}

message InstallPackageReply {
  repeated ServerInstallResult results = 1;
}

message GetNodeInventoryRequest {
  string lab_id = 1;
  string node_id = 2;
}

// InstalledPackage is one package version present in a server's
// local store.
message InstalledPackage {
  string name = 1;
  string version = 2;
  string sha256 = 3;
}

// NodeProgram is the agent-reported live view of one program on a
// server. managed marks programs the controller knows about; the
// rest were created node-locally (in-container CLI).
message NodeProgram {
  string name = 1;
  string package_name = 2;
  string package_version = 3;
  string entrypoint = 4;
  repeated string args = 5;
  string restart_policy = 6;
  string type = 7;
  bool auto_start = 8;
  string state = 9;
  int32 pid = 10;
  int32 restarts = 11;
  string last_error = 12;
  bool managed = 13;
  string health = 14;
  bool ready = 15;
}

message NodeInventory {
  repeated InstalledPackage packages = 1;
  repeated NodeProgram programs = 2;
}

message GetNodeMetricsRequest {
  string lab_id = 1;
  string node_id = 2;
}

// NodeMetrics is one resource-usage sample of a server, live from
// its agent. It mirrors the node-exporter collectors that stay
// meaningful inside a shared-kernel container: CPU, memory, disk I/O
// and process count are scoped to the container's cgroup / PID
// namespace, network to its netns; the load average is the host
// kernel's and thus identical on every server.
message NodeMetrics {
  // sampled_at is the unix time of the sample.
  int64 sampled_at = 1;
  // uptime_seconds is the container uptime (age of PID 1).
  int64 uptime_seconds = 2;
  // procs is the number of processes in the container.
  int64 procs = 3;
  MetricsCPU cpu = 4;
  MetricsMemory memory = 5;
  MetricsLoad load = 6;
  MetricsFilesystem filesystem = 7;
  MetricsDisk disk = 8;
  repeated MetricsInterface interfaces = 9;
}

// MetricsCPU is CPU usage normalised against the container's CPU
// limit: usage_percent is 0-100 of limit_cores, split into user and
// system time.
message MetricsCPU {
  double usage_percent = 1;
  double user_percent = 2;
  double system_percent = 3;
  // limit_cores is the cgroup CPU quota in cores; the host core
  // count when unlimited.
  double limit_cores = 4;
  // Cumulative CPU time in seconds since boot (counter semantics).
  double usage_seconds_total = 5;
  double user_seconds_total = 6;
  double system_seconds_total = 7;
}

// MetricsMemory reports container memory: used excludes the
// reclaimable page cache (node-exporter's MemAvailable convention),
// cache is the page cache, limit is memory.max or the host total
// when unlimited.
message MetricsMemory {
  int64 used_bytes = 1;
  int64 cache_bytes = 2;
  int64 limit_bytes = 3;
  int64 swap_used_bytes = 4;
}

// MetricsLoad is the host load average (shared kernel).
message MetricsLoad {
  double load1 = 1;
  double load5 = 2;
  double load15 = 3;
}

// MetricsFilesystem is the usage of the container root filesystem.
message MetricsFilesystem {
  string mount = 1;
  int64 size_bytes = 2;
  int64 used_bytes = 3;
  int64 avail_bytes = 4;
}

// MetricsDisk is block I/O attributed to the container by the io
// cgroup, aggregated over all devices.
message MetricsDisk {
  double read_bytes_per_sec = 1;
  double write_bytes_per_sec = 2;
  double read_ops_per_sec = 3;
  double write_ops_per_sec = 4;
  int64 read_bytes_total = 5;
  int64 write_bytes_total = 6;
  int64 read_ops_total = 7;
  int64 write_ops_total = 8;
}

// MetricsInterface is the traffic of one interface of the
// container's network namespace; error and drop counts are totals.
message MetricsInterface {
  string name = 1;
  double rx_bytes_per_sec = 2;
  double tx_bytes_per_sec = 3;
  double rx_packets_per_sec = 4;
  double tx_packets_per_sec = 5;
  int64 rx_bytes_total = 6;
  int64 tx_bytes_total = 7;
  int64 rx_errors = 8;
  int64 tx_errors = 9;
  int64 rx_dropped = 10;
  int64 tx_dropped = 11;
  int64 rx_packets_total = 12;
  int64 tx_packets_total = 13;
}

message GetNodeMetricsHistoryRequest {
  string lab_id = 1;
  string node_id = 2;
  // start and end bound the series in unix seconds; end defaults to
  // now, start to end minus 30 minutes.
  int64 start = 3;
  int64 end = 4;
  // step is reserved for server-side downsampling; 0 returns every
  // collected point.
  int32 step = 5;
}

// MetricsPoint is one collected sample of the series: the sweep time
// plus the same gauge groups as NodeMetrics. Rate values are averages
// over the collector's sweep interval (counter diffs).
message MetricsPoint {
  int64 ts = 1;
  int64 procs = 2;
  MetricsCPU cpu = 3;
  MetricsMemory memory = 4;
  MetricsLoad load = 5;
  MetricsFilesystem filesystem = 6;
  MetricsDisk disk = 7;
  repeated MetricsInterface interfaces = 8;
}

message NodeMetricsHistory {
  repeated MetricsPoint points = 1;
}

// --- Program ---

// HealthCheck probes a running program periodically. type is process
// (the supervised process exists), tcp (a local port accepts a
// connection) or http (a GET returns a 2xx/3xx status). The probe
// targets loopback inside the server; port and path apply to tcp/http.
message HealthCheck {
  string type = 1;
  int32 port = 2;
  string path = 3;
  int32 interval_seconds = 4;
  int32 timeout_seconds = 5;
  int32 failure_threshold = 6;
}

// ProgramSpec is the desired state of a program: the entrypoint of a
// package version plus arguments; desired_state is Running or
// Stopped.
message ProgramSpec {
  string lab_id = 1;
  string server_id = 2;
  string server_name = 3;
  string package_name = 4;
  string package_version = 5;
  // entrypoint is denormalised from the referenced package version.
  string entrypoint = 6;
  repeated string args = 7;
  // restart_policy is Never, OnFailure or Always; oneshot programs
  // reject Always (systemd semantics).
  string restart_policy = 8;
  string desired_state = 9;
  // type is simple (long-running daemon, the default) or oneshot
  // (runs to completion), mirroring systemd service types.
  string type = 10;
  // auto_start marks the program enabled (systemd: systemctl
  // enable): it starts on every server boot and every redeploy,
  // regardless of whether it was running before.
  bool auto_start = 11;
  // liveness_check, when set, restarts the program (per restart_policy)
  // after it fails failure_threshold consecutive probes.
  HealthCheck liveness_check = 12;
  // readiness_check, when set, reports whether the program is serving;
  // unlike the liveness check it never restarts, it only gates ready.
  HealthCheck readiness_check = 13;
  // startup_order sequences boot: programs start in ascending order.
  int32 startup_order = 14;
}

// ProgramStatus is the agent-observed state of a program: Configured,
// Running, Stopped, Failed, Exited (oneshot ran to completion) or
// Unknown.
message ProgramStatus {
  string state = 1;
  int32 pid = 2;
  int32 restarts = 3;
  string last_error = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp last_observed = 6;
  // health is the last liveness verdict: Unknown (no check or not yet
  // probed), Healthy or Unhealthy.
  string health = 7;
  // ready reflects the readiness check (true when running without a
  // readiness check, or the probe last passed).
  bool ready = 8;
}

// Program is a supervised process on one lab server.
message Program {
  ResourceMeta meta = 1;
  ProgramSpec spec = 2;
  ProgramStatus status = 3;
}

message CreateProgramRequest {
  string lab_id = 1;
  string name = 2;
  // server_ids deploys the same program onto several servers at once
  // (one Program resource per server, like a daemonset over the
  // selection).
  repeated string server_ids = 3;
  string package_name = 4;
  string package_version = 5;
  repeated string args = 6;
  string restart_policy = 7;
  // type is simple (default) or oneshot.
  string type = 8;
  bool auto_start = 9;
  // liveness_check optionally restarts the program when it stops
  // passing its probe.
  HealthCheck liveness_check = 10;
  // readiness_check optionally reports whether the program is serving.
  HealthCheck readiness_check = 11;
  // startup_order sequences boot: programs start in ascending order.
  int32 startup_order = 12;
  // start launches every created program right away (a oneshot runs
  // once), instead of leaving them stopped for a later start.
  bool start = 13;
}

message CreateProgramReply {
  repeated Program programs = 1;
  // failures lists servers the program could not be created for
  // (e.g. a program of the same name already exists there); creation
  // proceeds on the remaining servers.
  repeated ServerInstallResult failures = 2;
}

message BatchProgramRequest {
  string lab_id = 1;
  // op is start, stop or delete.
  string op = 2;
  repeated string ids = 3;
}

// ProgramOpResult is the outcome of one program in a batch operation;
// error is empty on success.
message ProgramOpResult {
  string id = 1;
  string name = 2;
  string error = 3;
}

message BatchProgramReply {
  repeated ProgramOpResult results = 1;
}

message UpgradeProgramRequest {
  string lab_id = 1;
  string id = 2;
  // version is the target package version (upgrade or rollback).
  string version = 3;
}

message ListProgramsRequest {
  string lab_id = 1;
}

message ListProgramsReply {
  repeated Program programs = 1;
}

message ProgramOpRequest {
  string lab_id = 1;
  string id = 2;
}

message DeleteProgramReply {}

message GetProgramLogsRequest {
  string lab_id = 1;
  string id = 2;
  // tail caps the returned lines (default and upper bound applied by
  // the agent).
  int32 tail = 3;
}

message ProgramLogs {
  string content = 1;
}

// --- Traffic ---

// TrafficAssertion is one pass/fail threshold evaluated against the
// scenario's latest metrics window. metric is rate, successRate, p50,
// p95 or p99; comparator is gte or lte.
message TrafficAssertion {
  string metric = 1;
  string comparator = 2;
  double threshold = 3;
}

// TrafficScenarioSpec is the desired shape of the traffic: which
// servers, which protocol, how hard to drive it. protocol is http,
// tcp or udp; port defaults per protocol when zero; rate maps onto
// one request per interval per client worker.
message TrafficScenarioSpec {
  string lab_id = 1;
  string source_server_id = 2;
  string source_server_name = 3;
  string dest_server_id = 4;
  string dest_server_name = 5;
  string protocol = 6;
  int32 port = 7;
  double rate = 8;
  int32 concurrency = 9;
  int32 payload_bytes = 10;
  // duration_seconds bounds how long the scenario runs before it
  // auto-stops; 0 runs until stopped manually.
  int32 duration_seconds = 11;
  repeated TrafficAssertion assertions = 12;
}

// TrafficAssertionResult is one assertion evaluated against the
// latest point.
message TrafficAssertionResult {
  string metric = 1;
  string comparator = 2;
  double threshold = 3;
  double value = 4;
  bool pass = 5;
}

// TrafficPoint is one collected sample: the client's windowed rate,
// success rate (percent) and latency percentiles (microseconds).
message TrafficPoint {
  int64 ts = 1;
  double rate = 2;
  double success_rate = 3;
  int64 p50_us = 4;
  int64 p95_us = 5;
  int64 p99_us = 6;
}

// TrafficScenarioStatus is the observed state: which Programs
// implement the scenario (empty when Stopped) and the latest
// collected metrics. phase is Stopped, Running or Failed.
message TrafficScenarioStatus {
  string phase = 1;
  string server_program_id = 2;
  string server_program_name = 3;
  string client_program_id = 4;
  string client_program_name = 5;
  google.protobuf.Timestamp started_at = 6;
  TrafficPoint last_point = 7;
  repeated TrafficAssertionResult assertions = 8;
  google.protobuf.Timestamp last_observed = 9;
  string last_error = 10;
}

message TrafficScenario {
  ResourceMeta meta = 1;
  TrafficScenarioSpec spec = 2;
  TrafficScenarioStatus status = 3;
}

message CreateTrafficScenarioRequest {
  string lab_id = 1;
  string name = 2;
  string source_server_id = 3;
  string dest_server_id = 4;
  string protocol = 5;
  int32 port = 6;
  double rate = 7;
  int32 concurrency = 8;
  int32 payload_bytes = 9;
  int32 duration_seconds = 10;
  repeated TrafficAssertion assertions = 11;
}

message ListTrafficScenariosRequest {
  string lab_id = 1;
}

message ListTrafficScenariosReply {
  repeated TrafficScenario scenarios = 1;
}

message TrafficScenarioOpRequest {
  string lab_id = 1;
  string id = 2;
}

message DeleteTrafficScenarioReply {}

message GetTrafficScenarioHistoryRequest {
  string lab_id = 1;
  string id = 2;
  // start and end bound the series in unix seconds; end defaults to
  // now, start to end minus 30 minutes.
  int64 start = 3;
  int64 end = 4;
}

message TrafficScenarioHistory {
  repeated TrafficPoint points = 1;
}

// --- Fault ---

// FaultTarget identifies what a fault acts on: a node (node_id) or a
// link (link_id). side selects which endpoint of a link an
// interface-down/impairment fault acts on ("a", "b" or "both");
// link-down always acts on both regardless of side. node_name/
// link_name are denormalised for display.
message FaultTarget {
  string kind = 1;
  string node_id = 2;
  string node_name = 3;
  string link_id = 4;
  string link_name = 5;
  string side = 6;
}

// FaultImpairment shapes egress traffic with one netem qdisc; zero
// fields are omitted from the qdisc, so at least one must be set.
message FaultImpairment {
  int32 delay_ms = 1;
  int32 jitter_ms = 2;
  double loss_percent = 3;
  int32 rate_kbit = 4;
}

// FaultScenarioSpec is the desired fault: its target and kind. type
// is node-stop, node-restart, link-down, interface-down or
// impairment; impairment only applies to the impairment type.
message FaultScenarioSpec {
  string lab_id = 1;
  FaultTarget target = 2;
  string type = 3;
  FaultImpairment impairment = 4;
}

// FaultScenarioStatus is the observed state: whether the fault is
// currently applied. node-restart is a point-in-time event, not a
// persisted state, so it never reports applied.
message FaultScenarioStatus {
  bool applied = 1;
  google.protobuf.Timestamp applied_at = 2;
  string last_error = 3;
}

message FaultScenario {
  ResourceMeta meta = 1;
  FaultScenarioSpec spec = 2;
  FaultScenarioStatus status = 3;
}

message CreateFaultScenarioRequest {
  string lab_id = 1;
  string name = 2;
  FaultTarget target = 3;
  string type = 4;
  FaultImpairment impairment = 5;
}

message ListFaultScenariosRequest {
  string lab_id = 1;
}

message ListFaultScenariosReply {
  repeated FaultScenario scenarios = 1;
}

message FaultScenarioOpRequest {
  string lab_id = 1;
  string id = 2;
}

message DeleteFaultScenarioReply {}

// --- Capture ---

// CaptureFilter restricts which frames are recorded; an empty filter
// records everything. protocol is arp, icmp, tcp, udp, bgp or vxlan
// (bgp/vxlan match their well-known ports); prefixes accept CIDR or
// bare addresses; port matches either transport side.
message CaptureFilter {
  string protocol = 1;
  string src_prefix = 2;
  string dst_prefix = 3;
  int32 port = 4;
}

// CaptureSessionSpec is the desired capture. interface must be a
// modelled interface of the node (a topology link endpoint or
// vlanif/bond0); direction is both (default), rx or tx; duration,
// snap_length, max_packets and max_bytes default and cap per the
// controller's capture policy.
message CaptureSessionSpec {
  string lab_id = 1;
  string node_id = 2;
  string node_name = 3;
  string interface = 4;
  string direction = 5;
  int32 snap_length = 6;
  int32 duration_seconds = 7;
  int64 max_packets = 8;
  int64 max_bytes = 9;
  CaptureFilter filter = 10;
}

// CaptureSessionStatus is the observed capture state: Running,
// Completed (ended by itself), Stopped (by the user) or Failed, plus
// the running counters. bytes counts captured (snapped) bytes.
message CaptureSessionStatus {
  string state = 1;
  int64 packets = 2;
  int64 bytes = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  string last_error = 6;
}

message CaptureSession {
  ResourceMeta meta = 1;
  CaptureSessionSpec spec = 2;
  CaptureSessionStatus status = 3;
}

message CreateCaptureSessionRequest {
  string lab_id = 1;
  string name = 2;
  string node_id = 3;
  string interface = 4;
  string direction = 5;
  int32 snap_length = 6;
  int32 duration_seconds = 7;
  int64 max_packets = 8;
  int64 max_bytes = 9;
  CaptureFilter filter = 10;
}

message ListCaptureSessionsRequest {
  string lab_id = 1;
}

message ListCaptureSessionsReply {
  repeated CaptureSession sessions = 1;
}

message CaptureSessionOpRequest {
  string lab_id = 1;
  string id = 2;
}

message DeleteCaptureSessionReply {}

// CapturePacket is one packet's metadata row: its position in the
// capture, direction (rx/tx), lengths (wire vs captured after snap)
// and the decoded one-line summary (Wireshark list columns).
message CapturePacket {
  int64 index = 1;
  google.protobuf.Timestamp ts = 2;
  string direction = 3;
  int32 capture_length = 4;
  int32 wire_length = 5;
  string source = 6;
  string destination = 7;
  string protocol = 8;
  string info = 9;
  // source_port/destination_port are set only for TCP/UDP conversations.
  int32 source_port = 10;
  int32 destination_port = 11;
}

// ListCapturePacketsRequest pages through a capture's packets by
// index; limit defaults and caps per the controller.
message ListCapturePacketsRequest {
  string lab_id = 1;
  string id = 2;
  int64 offset = 3;
  int32 limit = 4;
}

// ListCapturePacketsReply returns one page. total is the number of
// packets captured so far; first_available is the oldest index still
// listable (older packets of a live session may have been evicted
// from the in-memory window — the pcapng download always has all of
// them).
message ListCapturePacketsReply {
  repeated CapturePacket packets = 1;
  int64 total = 2;
  int64 first_available = 3;
}

message GetCapturePacketRequest {
  string lab_id = 1;
  string id = 2;
  int64 index = 3;
}

// CapturePacketField is one name/value line of a decoded layer.
// offset/length locate the field's bytes in the raw frame for the
// viewer's hex highlight sync; length 0 means the field has no fixed
// byte range (e.g. a derived value such as a payload length).
message CapturePacketField {
  string name = 1;
  string value = 2;
  int32 offset = 3;
  int32 length = 4;
  // children nest sub-fields, e.g. each path attribute under the BGP
  // UPDATE "Path Attributes" line.
  repeated CapturePacketField children = 5;
}

// CapturePacketLayer is one decoded protocol layer of the tree view.
// offset/length is the layer's own byte range in the raw frame.
message CapturePacketLayer {
  string name = 1;
  repeated CapturePacketField fields = 2;
  int32 offset = 3;
  int32 length = 4;
}

// CapturePacketDetail is one packet opened in the viewer: the decoded
// protocol tree plus the snapped raw bytes for the hex pane.
message CapturePacketDetail {
  CapturePacket packet = 1;
  repeated CapturePacketLayer layers = 2;
  bytes data = 3;
}

// --- Plan ---

// PlanOperation is one intended change with a human-readable summary.
message PlanOperation {
  string type = 1;
  string target = 2;
  string summary = 3;
}

// Allocation records one resource allocation the plan will consume.
message Allocation {
  string pool = 1;
  string value = 2;
  string owner = 3;
}

// PlanWarning is a non-fatal issue detected while planning.
message PlanWarning {
  string code = 1;
  string message = 2;
}

// Plan is a previewable change set computed from desired state.
// State is Pending, Applied or Expired.
message Plan {
  string id = 1;
  string lab_id = 2;
  int64 base_generation = 3;
  int64 new_generation = 4;
  string state = 5;
  repeated PlanOperation operations = 6;
  repeated Allocation allocations = 7;
  repeated PlanWarning warnings = 8;
  google.protobuf.Timestamp created_at = 9;
}

// --- Operation ---

// OperationStep is one step in an operation's execution.
message OperationStep {
  string name = 1;
  string state = 2;
  string message = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
}

// OperationError is a structured operation failure.
message OperationError {
  string code = 1;
  string message = 2;
}

// ResourceRef points at the resource an operation acts on.
message ResourceRef {
  string type = 1;
  string id = 2;
}

// Operation tracks one asynchronous change. Every write API returns
// an operation reference; the UI follows progress via polling.
// State is Queued, Running, Succeeded, Failed or Cancelled.
message Operation {
  string id = 1;
  string lab_id = 2;
  string type = 3;
  ResourceRef resource = 4;
  string state = 5;
  int32 progress = 6;
  repeated OperationStep steps = 7;
  OperationError error = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// OperationRef is returned by async write APIs.
message OperationRef {
  string operation_id = 1;
}

// --- Requests / replies ---

message CreateLabRequest {
  string name = 1;
  // Profile is micro, standard or custom; defaults to micro.
  string profile = 2;
  // Topology is required (and only used) with the custom profile.
  TopologySpec topology = 3;
  // InternetAccess applies to every profile: it toggles
  // TopologySpec.internet_access on the resulting lab.
  bool internet_access = 4;
}

message ListLabsRequest {}

message ListLabsReply {
  repeated Lab labs = 1;
}

message GetLabRequest {
  string id = 1;
}

message DeleteLabRequest {
  string id = 1;
}

message StartLabRequest {
  string id = 1;
}

message StopLabRequest {
  string id = 1;
}

message RepairLabRequest {
  string id = 1;
}

message UpdateLabTopologyRequest {
  string lab_id = 1;
  // Topology is the new desired shape. internet_access is ignored:
  // the internet attachment is fixed at lab creation.
  TopologySpec topology = 2;
}

// GenerationInfo summarises one retained generation snapshot.
message GenerationInfo {
  int64 generation = 1;
  google.protobuf.Timestamp created_at = 2;
  int32 node_count = 3;
  int32 link_count = 4;
  // deployed marks the generation the lab currently runs.
  bool deployed = 5;
}

message RollbackLabRequest {
  string lab_id = 1;
  int64 generation = 2;
}

message StartNodeRequest {
  string lab_id = 1;
  string node_id = 2;
}

message StopNodeRequest {
  string lab_id = 1;
  string node_id = 2;
}

message GetNodeRuntimeRequest {
  string lab_id = 1;
  string node_id = 2;
}

// RuntimeInterface is one kernel interface of a node's container.
message RuntimeInterface {
  string name = 1;
  // state is the raw operational state from `ip -br link`:
  // UP, DOWN, UNKNOWN, LOWERLAYERDOWN.
  string state = 2;
  string mac = 3;
  repeated string addresses = 4;
}

// NodeRuntime is the management view of one deployed node.
message NodeRuntime {
  // container_state is the docker container state ("running",
  // "paused", "exited", ... or "missing").
  string container_state = 1;
  // interfaces is empty unless the container is running.
  repeated RuntimeInterface interfaces = 2;
}

message GetNodeBGPRequest {
  string lab_id = 1;
  string node_id = 2;
}

// BGPNeighbor is one statically configured BGP session.
message BGPNeighbor {
  string address = 1;
  uint32 remote_as = 2;
  // description names the peer device (as in frr.conf).
  string description = 3;
}

// BGPServerGroup is the leaf's dynamic peer-group listening for the
// rack's servers on the VLAN subnet.
message BGPServerGroup {
  uint32 remote_as = 1;
  string listen_range = 2;
}

// NodeBGP is the compiled BGP configuration of one node.
message NodeBGP {
  uint32 asn = 1;
  string router_id = 2;
  repeated BGPNeighbor neighbors = 3;
  BGPServerGroup server_group = 4;
}

message GetNodeRoutesRequest {
  string lab_id = 1;
  string node_id = 2;
}

// RouteNexthop is one next hop of a RIB entry; via is empty for
// directly connected routes.
message RouteNexthop {
  string via = 1;
  string interface = 2;
  bool active = 3;
}

// Route is one IPv4 RIB entry as reported by FRR. The FIB view
// reuses it: kind is "local" for host entries (traffic addressed to
// the device itself, the ASIC host/punt table equivalent) and empty
// for forwarding (LPM) entries.
message Route {
  string prefix = 1;
  // protocol is the FRR origin: bgp, connected, static, kernel, ...
  string protocol = 2;
  bool selected = 3;
  int32 distance = 4;
  int32 metric = 5;
  repeated RouteNexthop nexthops = 6;
  string kind = 7;
}

// NodeRoutes is the live routing table of one deployed node.
message NodeRoutes {
  // container_state is the docker container state; routes are only
  // collected from a running container.
  string container_state = 1;
  repeated Route routes = 2;
}

message GetNodeBGPTableRequest {
  string lab_id = 1;
  string node_id = 2;
}

// BGPPath is one candidate path of the BGP Loc-RIB.
message BGPPath {
  string prefix = 1;
  bool best = 2;
  bool multipath = 3;
  bool valid = 4;
  // internal marks an iBGP path (pathFrom internal).
  bool internal = 5;
  string as_path = 6;
  string origin = 7;
  uint32 local_pref = 8;
  string peer = 9;
  string nexthop = 10;
  // nexthop_name is the advertising device's hostname when known.
  string nexthop_name = 11;
}

// NodeBGPTable is the live BGP Loc-RIB of one deployed node.
message NodeBGPTable {
  string container_state = 1;
  string router_id = 2;
  uint32 local_as = 3;
  repeated BGPPath paths = 4;
}

message GetNodeFIBRequest {
  string lab_id = 1;
  string node_id = 2;
}

// NodeFIB is the live kernel forwarding table of one deployed node;
// entries reuse Route (distance/selected are not meaningful here).
message NodeFIB {
  string container_state = 1;
  repeated Route routes = 2;
}

message GetNodeMTRRequest {
  string lab_id = 1;
  string node_id = 2;
  // target_node_id probes another node of the same lab, resolved to
  // its reachable address (loopback for routers, bond0 for servers).
  // Wins over target when both are set.
  string target_node_id = 3;
  // target is a free-form address or hostname, for probing outside
  // the lab (e.g. the real internet when internet access is enabled).
  string target = 4;
  // protocol selects the probe type: "icmp" (default), "tcp" or
  // "udp".
  string protocol = 5;
  // port is the destination port for tcp/udp probes; ignored for
  // icmp.
  int32 port = 6;
  // cycles is the number of probe rounds per hop (default 10, max
  // 30).
  int32 cycles = 7;
}

// MTRHop is one hop of a measured path, aggregated over all probe
// cycles.
message MTRHop {
  int32 ttl = 1;
  // host is the raw responding address, empty when every probe at
  // this hop timed out.
  string host = 2;
  bool timeout = 3;
  double loss_percent = 4;
  int32 sent = 5;
  double last_ms = 6;
  double avg_ms = 7;
  double best_ms = 8;
  double worst_ms = 9;
  double stddev_ms = 10;
  // node_id/node_name/node_role are set when host resolves to a node
  // of this lab's topology model.
  string node_id = 11;
  string node_name = 12;
  string node_role = 13;
}

// NodeMTR is the result of one mtr diagnostic probe.
message NodeMTR {
  string container_state = 1;
  string target = 2;
  string protocol = 3;
  int32 port = 4;
  repeated MTRHop hops = 5;
  // path_link_ids is the ordered set of link ids connecting
  // consecutive resolved hops, for drawing the measured path on the
  // topology graph.
  repeated string path_link_ids = 6;
}

message ScanMTRPathsRequest {
  string lab_id = 1;
  string node_id = 2;
  string target_node_id = 3;
  string target = 4;
  // protocol must be "tcp" or "udp"; icmp is rejected (see
  // ScanMTRPaths).
  string protocol = 5;
  int32 port = 6;
  // samples is how many independent mtr runs to make (default 8, max
  // 20).
  int32 samples = 7;
  // cycles is the probe rounds per sample (default 3, max 10) — kept
  // low since the total scan time is samples * cycles.
  int32 cycles = 8;
}

// MTRScanPath is one distinct path observed while scanning; count is
// how many of the samples measured it.
message MTRScanPath {
  repeated MTRHop hops = 1;
  repeated string path_link_ids = 2;
  int32 count = 3;
}

// MTRPathScan is the result of scanning for distinct ECMP paths.
message MTRPathScan {
  string container_state = 1;
  string target = 2;
  string protocol = 3;
  int32 port = 4;
  int32 samples_run = 5;
  repeated MTRScanPath paths = 6;
}

