// DCNetLab controller API. The protobuf definition is the single
// source of truth for the REST surface; HTTP bindings are declared
// with google.api.http annotations and served by Kratos. JSON field
// names follow the protojson camelCase mapping, which matches the
// original hand-written REST API consumed by the web UI.
syntax = "proto3";

package dcnetlab.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ifantsai/dcnetlab/pb/dcnetlab/v1;v1";

// DCNetLab is the controller service: lab lifecycle, plan/apply,
// topology queries and async operation tracking.
service DCNetLab {
  // --- Labs ---
  rpc CreateLab(CreateLabRequest) returns (Lab) {
    option (google.api.http) = {
      post: "/api/v1/labs"
      body: "*"
    };
  }
  rpc ListLabs(ListLabsRequest) returns (ListLabsReply) {
    option (google.api.http) = {get: "/api/v1/labs"};
  }
  rpc GetLab(GetLabRequest) returns (Lab) {
    option (google.api.http) = {get: "/api/v1/labs/{id}"};
  }
  rpc DeleteLab(DeleteLabRequest) returns (OperationRef) {
    option (google.api.http) = {delete: "/api/v1/labs/{id}"};
  }
  // StartLab / StopLab power the deployed containers of a lab on and
  // off (docker start/stop) without touching the generation.
  rpc StartLab(StartLabRequest) returns (OperationRef) {
    option (google.api.http) = {
      post: "/api/v1/labs/{id}/start"
      body: "*"
    };
  }
  rpc StopLab(StopLabRequest) returns (OperationRef) {
    option (google.api.http) = {
      post: "/api/v1/labs/{id}/stop"
      body: "*"
    };
  }

  // --- Topology ---
  rpc ListNodes(ListNodesRequest) returns (ListNodesReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes"};
  }
  rpc ListLinks(ListLinksRequest) returns (ListLinksReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/links"};
  }
  rpc ListAllocations(ListAllocationsRequest) returns (ListAllocationsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/allocations"};
  }
  // StartNode / StopNode power a single device on and off.
  rpc StartNode(StartNodeRequest) returns (Node) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/nodes/{node_id}/start"
      body: "*"
    };
  }
  rpc StopNode(StopNodeRequest) returns (Node) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/nodes/{node_id}/stop"
      body: "*"
    };
  }
  // GetNodeRuntime returns the management view of one deployed node:
  // the underlying container state and every kernel interface inside
  // it, including implementation plumbing (bridge, VRRP macvlan,
  // management eth0) that the simulated topology does not model.
  rpc GetNodeRuntime(GetNodeRuntimeRequest) returns (NodeRuntime) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/runtime"};
  }
  // GetNodeBGP returns the BGP configuration of one node as derived
  // by the FRR compiler from the topology model: eBGP neighbors over
  // fabric links, the MLAG iBGP session and the leaf's dynamic server
  // peer-group. Empty for nodes that do not run BGP.
  rpc GetNodeBGP(GetNodeBGPRequest) returns (NodeBGP) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/bgp"};
  }
  // GetNodeRoutes returns the live IPv4 routing table (FRR RIB) of
  // one deployed node; routes are empty unless the container is
  // running.
  rpc GetNodeRoutes(GetNodeRoutesRequest) returns (NodeRoutes) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/routes"};
  }
  // GetNodeBGPTable returns the live BGP Loc-RIB of one deployed
  // node (`show ip bgp`): every candidate path per prefix, before
  // best-path selection reduces them to the RIB entry.
  rpc GetNodeBGPTable(GetNodeBGPTableRequest) returns (NodeBGPTable) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/bgp-table"};
  }
  // GetNodeFIB returns the live kernel forwarding table of one
  // deployed node (`ip route`): what actually forwards packets, as
  // installed by zebra from the RIB.
  rpc GetNodeFIB(GetNodeFIBRequest) returns (NodeFIB) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/fib"};
  }

  // --- Packages ---
  // Packages are versioned program artifacts (tar.gz with a
  // manifest.json) in the controller's repository; lab servers
  // install them through their agent. The bundled lab-app registers
  // as the builtin package; uploads use the same pipeline.
  rpc UploadPackage(UploadPackageRequest) returns (Package) {
    option (google.api.http) = {
      post: "/api/v1/packages"
      body: "*"
    };
  }
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesReply) {
    option (google.api.http) = {get: "/api/v1/packages"};
  }
  rpc DeletePackage(DeletePackageRequest) returns (DeletePackageReply) {
    option (google.api.http) = {delete: "/api/v1/packages/{name}/{version}"};
  }
  // GetNodeInventory reports what is actually on one server, live
  // from its agent: installed package versions and every program
  // (controller-managed or created node-locally via the in-container
  // CLI).
  rpc GetNodeInventory(GetNodeInventoryRequest) returns (NodeInventory) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/nodes/{node_id}/inventory"};
  }
  // InstallPackage delivers a package version onto lab servers
  // without declaring a program — the "deploy a binary" path (apt
  // install without a service unit). Idempotent per server: agents
  // skip versions already present with the same digest.
  rpc InstallPackage(InstallPackageRequest) returns (InstallPackageReply) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/packages/{name}/{version}/install"
      body: "*"
    };
  }

  // --- Programs ---
  // Programs are supervised processes on lab servers, each running
  // the entrypoint of an installed Package version, managed through
  // the per-server dcnetlab-server-agent.
  rpc CreateProgram(CreateProgramRequest) returns (CreateProgramReply) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs"
      body: "*"
    };
  }
  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/programs"};
  }
  rpc StartProgram(ProgramOpRequest) returns (Program) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs/{id}/start"
      body: "*"
    };
  }
  rpc StopProgram(ProgramOpRequest) returns (Program) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs/{id}/stop"
      body: "*"
    };
  }
  rpc UpgradeProgram(UpgradeProgramRequest) returns (Program) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/programs/{id}/upgrade"
      body: "*"
    };
  }
  rpc DeleteProgram(ProgramOpRequest) returns (DeleteProgramReply) {
    option (google.api.http) = {delete: "/api/v1/labs/{lab_id}/programs/{id}"};
  }
  rpc GetProgramLogs(GetProgramLogsRequest) returns (ProgramLogs) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/programs/{id}/logs"};
  }

  // --- Plans ---
  rpc CreatePlan(CreatePlanRequest) returns (Plan) {
    option (google.api.http) = {
      post: "/api/v1/labs/{lab_id}/plans"
      body: "*"
    };
  }
  rpc GetPlan(GetPlanRequest) returns (Plan) {
    option (google.api.http) = {get: "/api/v1/plans/{id}"};
  }
  rpc ApplyPlan(ApplyPlanRequest) returns (OperationRef) {
    option (google.api.http) = {
      post: "/api/v1/plans/{id}/apply"
      body: "*"
    };
  }

  // --- Operations & Generations ---
  rpc GetOperation(GetOperationRequest) returns (Operation) {
    option (google.api.http) = {get: "/api/v1/operations/{id}"};
  }
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/operations"};
  }
  rpc ListGenerations(ListGenerationsRequest) returns (ListGenerationsReply) {
    option (google.api.http) = {get: "/api/v1/labs/{lab_id}/generations"};
  }

  // --- Profiles & health ---
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesReply) {
    option (google.api.http) = {get: "/api/v1/profiles"};
  }
  rpc Healthz(HealthzRequest) returns (HealthzReply) {
    option (google.api.http) = {get: "/api/v1/healthz"};
  }
}

// --- Common resource metadata ---

// ResourceError is a structured error attached to a resource status.
message ResourceError {
  string code = 1;
  string message = 2;
  google.protobuf.Timestamp time = 3;
}

// ResourceMeta is the common metadata embedded in every resource.
// Phase is the unified lifecycle: Pending, Planning, Applying,
// Running, Degraded, Failed, Stopping, Stopped, Deleting, Deleted.
message ResourceMeta {
  string id = 1;
  string name = 2;
  int64 generation = 3;
  int64 observed_generation = 4;
  string phase = 5;
  ResourceError last_error = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// --- Lab ---

// AddressPool declares one CIDR pool managed by the IPAM allocator.
message AddressPool {
  string name = 1;
  string cidr = 2;
  int32 allocation_prefix = 3;
}

// ASNRange declares a contiguous ASN range for one device role.
message ASNRange {
  string role = 1;
  uint32 start = 2;
  uint32 end = 3;
}

// PodSpec describes one pod: leaves come in racks, each rack is one
// MLAG pair of leaf switches plus its servers.
message PodSpec {
  string name = 1;
  int32 spines = 2;
  int32 racks = 3;
  int32 servers_per_rack = 4;
}

// TopologySpec describes the desired fabric shape.
message TopologySpec {
  int32 external_routers = 1;
  int32 dc_edges = 2;
  int32 super_spines = 3;
  repeated PodSpec pods = 4;
}

message LabSpec {
  string profile = 1;
  TopologySpec topology = 2;
  repeated AddressPool pools = 3;
  repeated ASNRange asns = 4;
}

message LabStatus {
  int32 node_count = 1;
  int32 link_count = 2;
}

// Lab is the top-level resource holding one simulated data center.
message Lab {
  ResourceMeta meta = 1;
  LabSpec spec = 2;
  LabStatus status = 3;
}

// --- Node ---

// NodeSpec is the desired state of a node. Addresses are CIDR or IP
// strings; empty means unset.
message NodeSpec {
  string lab_id = 1;
  string role = 2;
  string pod_id = 3;
  string rack_id = 4;
  uint32 asn = 5;
  string loopback = 6;
  string mgmt_ip = 7;
  string runtime_type = 8;

  // Leaf-only: MLAG pair member acting as the VRRP active-active
  // gateway of the rack's server VLAN.
  string mlag_peer = 9;
  int32 vlan_id = 10;
  string vlan_ip = 11;
  string gateway_ip = 12;
  string gateway_mac = 13;
  int32 vrrp_group = 14;
  int32 vrrp_priority = 15;

  // Server-only: bond0 address, virtual gateway and the physical
  // VlanIPs of the two MLAG leaves as BGP peers.
  string address = 16;
  string default_gateway = 17;
  repeated string bgp_peers = 18;
}

// InterfaceStatus is the observed state of one simulated interface.
message InterfaceStatus {
  string name = 1;
  bool up = 2;
}

// NodeStatus is the observed state of a node, filled by the observer.
// Interface counts and the interface list cover only the simulated
// objects: topology link endpoints plus modeled logical interfaces
// (the gateway vlanif on leaves, bond0 on servers).
message NodeStatus {
  string runtime_state = 1;
  string container_id = 2;
  int32 route_count = 3;
  int32 bgp_established = 4;
  int32 bgp_configured = 5;
  int32 interfaces_up = 6;
  int32 interfaces_total = 7;
  google.protobuf.Timestamp last_observed = 8;
  // vrrp_state is the VRRP gateway role of a leaf: Master, Backup or
  // empty for nodes without VRRP.
  string vrrp_state = 9;
  repeated InterfaceStatus interfaces = 10;
}

// Node is one device in the fabric: router, switch or server.
message Node {
  ResourceMeta meta = 1;
  NodeSpec spec = 2;
  NodeStatus status = 3;
}

// --- Link ---

// LinkEndpoint is one side of a point-to-point link.
message LinkEndpoint {
  string node_id = 1;
  string node_name = 2;
  string interface = 3;
  string address = 4;
}

// LinkSpec is the desired state of a link. Kind is fabric,
// server-access or mlag-peer; L2 links carry no endpoint addresses.
message LinkSpec {
  string lab_id = 1;
  string kind = 2;
  int32 vlan_id = 3;
  LinkEndpoint endpoint_a = 4;
  LinkEndpoint endpoint_b = 5;
  int32 mtu = 6;
}

message LinkStatus {
  bool admin_up = 1;
  bool oper_up = 2;
}

// Link is a point-to-point link between two nodes.
message Link {
  ResourceMeta meta = 1;
  LinkSpec spec = 2;
  LinkStatus status = 3;
}

// --- Package ---

// Package is one versioned program artifact in the controller's
// repository.
message Package {
  ResourceMeta meta = 1;
  string version = 2;
  // format is targz (the only supported format for now).
  string format = 3;
  // entrypoint is the executable inside the archive, relative to its
  // root.
  string entrypoint = 4;
  string description = 5;
  string sha256 = 6;
  int64 size_bytes = 7;
  // builtin packages ship with the controller and cannot be deleted.
  bool builtin = 8;
}

message UploadPackageRequest {
  // payload is the tar.gz archive; identity comes from its embedded
  // manifest.json (name, version, entrypoint, description).
  bytes payload = 1;
}

message ListPackagesRequest {}

message ListPackagesReply {
  repeated Package packages = 1;
}

message DeletePackageRequest {
  string name = 1;
  string version = 2;
}

message DeletePackageReply {}

message InstallPackageRequest {
  string lab_id = 1;
  string name = 2;
  string version = 3;
  // server_ids narrows the delivery; empty installs on every server
  // of the lab.
  repeated string server_ids = 4;
}

// ServerInstallResult is the per-server outcome of a package
// delivery; error is empty on success.
message ServerInstallResult {
  string server_id = 1;
  string server_name = 2;
  string error = 3;
}

message InstallPackageReply {
  repeated ServerInstallResult results = 1;
}

message GetNodeInventoryRequest {
  string lab_id = 1;
  string node_id = 2;
}

// InstalledPackage is one package version present in a server's
// local store.
message InstalledPackage {
  string name = 1;
  string version = 2;
  string sha256 = 3;
}

// NodeProgram is the agent-reported live view of one program on a
// server. managed marks programs the controller knows about; the
// rest were created node-locally (in-container CLI).
message NodeProgram {
  string name = 1;
  string package_name = 2;
  string package_version = 3;
  string entrypoint = 4;
  repeated string args = 5;
  string restart_policy = 6;
  string type = 7;
  bool auto_start = 8;
  string state = 9;
  int32 pid = 10;
  int32 restarts = 11;
  string last_error = 12;
  bool managed = 13;
}

message NodeInventory {
  repeated InstalledPackage packages = 1;
  repeated NodeProgram programs = 2;
}

// --- Program ---

// ProgramSpec is the desired state of a program: the entrypoint of a
// package version plus arguments; desired_state is Running or
// Stopped.
message ProgramSpec {
  string lab_id = 1;
  string server_id = 2;
  string server_name = 3;
  string package_name = 4;
  string package_version = 5;
  // entrypoint is denormalised from the referenced package version.
  string entrypoint = 6;
  repeated string args = 7;
  // restart_policy is Never, OnFailure or Always; oneshot programs
  // reject Always (systemd semantics).
  string restart_policy = 8;
  string desired_state = 9;
  // type is simple (long-running daemon, the default) or oneshot
  // (runs to completion), mirroring systemd service types.
  string type = 10;
  // auto_start marks the program enabled (systemd: systemctl
  // enable): it starts on every server boot and every redeploy,
  // regardless of whether it was running before.
  bool auto_start = 11;
}

// ProgramStatus is the agent-observed state of a program: Configured,
// Running, Stopped, Failed, Exited (oneshot ran to completion) or
// Unknown.
message ProgramStatus {
  string state = 1;
  int32 pid = 2;
  int32 restarts = 3;
  string last_error = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp last_observed = 6;
}

// Program is a supervised process on one lab server.
message Program {
  ResourceMeta meta = 1;
  ProgramSpec spec = 2;
  ProgramStatus status = 3;
}

message CreateProgramRequest {
  string lab_id = 1;
  string name = 2;
  // server_ids deploys the same program onto several servers at once
  // (one Program resource per server, like a daemonset over the
  // selection).
  repeated string server_ids = 3;
  string package_name = 4;
  string package_version = 5;
  repeated string args = 6;
  string restart_policy = 7;
  // type is simple (default) or oneshot.
  string type = 8;
  bool auto_start = 9;
}

message CreateProgramReply {
  repeated Program programs = 1;
  // failures lists servers the program could not be created for
  // (e.g. a program of the same name already exists there); creation
  // proceeds on the remaining servers.
  repeated ServerInstallResult failures = 2;
}

message UpgradeProgramRequest {
  string lab_id = 1;
  string id = 2;
  // version is the target package version (upgrade or rollback).
  string version = 3;
}

message ListProgramsRequest {
  string lab_id = 1;
}

message ListProgramsReply {
  repeated Program programs = 1;
}

message ProgramOpRequest {
  string lab_id = 1;
  string id = 2;
}

message DeleteProgramReply {}

message GetProgramLogsRequest {
  string lab_id = 1;
  string id = 2;
  // tail caps the returned lines (default and upper bound applied by
  // the agent).
  int32 tail = 3;
}

message ProgramLogs {
  string content = 1;
}

// --- Plan ---

// PlanOperation is one intended change with a human-readable summary.
message PlanOperation {
  string type = 1;
  string target = 2;
  string summary = 3;
}

// Allocation records one resource allocation the plan will consume.
message Allocation {
  string pool = 1;
  string value = 2;
  string owner = 3;
}

// PlanWarning is a non-fatal issue detected while planning.
message PlanWarning {
  string code = 1;
  string message = 2;
}

// Plan is a previewable change set computed from desired state.
// State is Pending, Applied or Expired.
message Plan {
  string id = 1;
  string lab_id = 2;
  int64 base_generation = 3;
  int64 new_generation = 4;
  string state = 5;
  repeated PlanOperation operations = 6;
  repeated Allocation allocations = 7;
  repeated PlanWarning warnings = 8;
  google.protobuf.Timestamp created_at = 9;
}

// --- Operation ---

// OperationStep is one step in an operation's execution.
message OperationStep {
  string name = 1;
  string state = 2;
  string message = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
}

// OperationError is a structured operation failure.
message OperationError {
  string code = 1;
  string message = 2;
}

// ResourceRef points at the resource an operation acts on.
message ResourceRef {
  string type = 1;
  string id = 2;
}

// Operation tracks one asynchronous change. Every write API returns
// an operation reference; the UI follows progress via polling.
// State is Queued, Running, Succeeded, Failed or Cancelled.
message Operation {
  string id = 1;
  string lab_id = 2;
  string type = 3;
  ResourceRef resource = 4;
  string state = 5;
  int32 progress = 6;
  repeated OperationStep steps = 7;
  OperationError error = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// OperationRef is returned by async write APIs.
message OperationRef {
  string operation_id = 1;
}

// --- Requests / replies ---

message CreateLabRequest {
  string name = 1;
  // Profile is micro, standard or custom; defaults to micro.
  string profile = 2;
  // Topology is required (and only used) with the custom profile.
  TopologySpec topology = 3;
}

message ListLabsRequest {}

message ListLabsReply {
  repeated Lab labs = 1;
}

message GetLabRequest {
  string id = 1;
}

message DeleteLabRequest {
  string id = 1;
}

message StartLabRequest {
  string id = 1;
}

message StopLabRequest {
  string id = 1;
}

message StartNodeRequest {
  string lab_id = 1;
  string node_id = 2;
}

message StopNodeRequest {
  string lab_id = 1;
  string node_id = 2;
}

message GetNodeRuntimeRequest {
  string lab_id = 1;
  string node_id = 2;
}

// RuntimeInterface is one kernel interface of a node's container.
message RuntimeInterface {
  string name = 1;
  // state is the raw operational state from `ip -br link`:
  // UP, DOWN, UNKNOWN, LOWERLAYERDOWN.
  string state = 2;
  string mac = 3;
  repeated string addresses = 4;
}

// NodeRuntime is the management view of one deployed node.
message NodeRuntime {
  // container_state is the docker container state ("running",
  // "paused", "exited", ... or "missing").
  string container_state = 1;
  // interfaces is empty unless the container is running.
  repeated RuntimeInterface interfaces = 2;
}

message GetNodeBGPRequest {
  string lab_id = 1;
  string node_id = 2;
}

// BGPNeighbor is one statically configured BGP session.
message BGPNeighbor {
  string address = 1;
  uint32 remote_as = 2;
  // description names the peer device (as in frr.conf).
  string description = 3;
}

// BGPServerGroup is the leaf's dynamic peer-group listening for the
// rack's servers on the VLAN subnet.
message BGPServerGroup {
  uint32 remote_as = 1;
  string listen_range = 2;
}

// NodeBGP is the compiled BGP configuration of one node.
message NodeBGP {
  uint32 asn = 1;
  string router_id = 2;
  repeated BGPNeighbor neighbors = 3;
  BGPServerGroup server_group = 4;
}

message GetNodeRoutesRequest {
  string lab_id = 1;
  string node_id = 2;
}

// RouteNexthop is one next hop of a RIB entry; via is empty for
// directly connected routes.
message RouteNexthop {
  string via = 1;
  string interface = 2;
  bool active = 3;
}

// Route is one IPv4 RIB entry as reported by FRR. The FIB view
// reuses it: kind is "local" for host entries (traffic addressed to
// the device itself, the ASIC host/punt table equivalent) and empty
// for forwarding (LPM) entries.
message Route {
  string prefix = 1;
  // protocol is the FRR origin: bgp, connected, static, kernel, ...
  string protocol = 2;
  bool selected = 3;
  int32 distance = 4;
  int32 metric = 5;
  repeated RouteNexthop nexthops = 6;
  string kind = 7;
}

// NodeRoutes is the live routing table of one deployed node.
message NodeRoutes {
  // container_state is the docker container state; routes are only
  // collected from a running container.
  string container_state = 1;
  repeated Route routes = 2;
}

message GetNodeBGPTableRequest {
  string lab_id = 1;
  string node_id = 2;
}

// BGPPath is one candidate path of the BGP Loc-RIB.
message BGPPath {
  string prefix = 1;
  bool best = 2;
  bool multipath = 3;
  bool valid = 4;
  // internal marks an iBGP path (pathFrom internal).
  bool internal = 5;
  string as_path = 6;
  string origin = 7;
  uint32 local_pref = 8;
  string peer = 9;
  string nexthop = 10;
  // nexthop_name is the advertising device's hostname when known.
  string nexthop_name = 11;
}

// NodeBGPTable is the live BGP Loc-RIB of one deployed node.
message NodeBGPTable {
  string container_state = 1;
  string router_id = 2;
  uint32 local_as = 3;
  repeated BGPPath paths = 4;
}

message GetNodeFIBRequest {
  string lab_id = 1;
  string node_id = 2;
}

// NodeFIB is the live kernel forwarding table of one deployed node;
// entries reuse Route (distance/selected are not meaningful here).
message NodeFIB {
  string container_state = 1;
  repeated Route routes = 2;
}

message ListNodesRequest {
  string lab_id = 1;
}

message ListNodesReply {
  repeated Node nodes = 1;
}

message ListLinksRequest {
  string lab_id = 1;
}

message ListLinksReply {
  repeated Link links = 1;
}

message ListAllocationsRequest {
  string lab_id = 1;
}

message ListAllocationsReply {
  repeated Allocation allocations = 1;
}

message CreatePlanRequest {
  string lab_id = 1;
}

message GetPlanRequest {
  string id = 1;
}

message ApplyPlanRequest {
  string id = 1;
}

message GetOperationRequest {
  string id = 1;
}

message ListOperationsRequest {
  string lab_id = 1;
}

message ListOperationsReply {
  repeated Operation operations = 1;
}

message ListGenerationsRequest {
  string lab_id = 1;
}

message ListGenerationsReply {
  repeated int64 generations = 1;
}

message ListProfilesRequest {}

// ProfileInfo names one predefined topology profile.
message ProfileInfo {
  string name = 1;
  TopologySpec topology = 2;
}

message ListProfilesReply {
  repeated ProfileInfo profiles = 1;
}

message HealthzRequest {}

message HealthzReply {
  string status = 1;
}
