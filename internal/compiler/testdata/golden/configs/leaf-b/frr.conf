frr defaults datacenter
hostname leaf-b
service integrated-vtysh-config
!
interface lo
 ip address 10.1.0.2/32
!
interface eth1
 description to spine-1
 ip address 10.0.0.3/31
!
interface vlan1000
 description server gateway (rack-1)
 ip address 10.100.0.3/24
 vrrp 1 priority 100
 vrrp 1 ip 10.100.0.1
!
router bgp 4200080001
 bgp router-id 10.1.0.2
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65200
 neighbor 10.0.0.2 description spine-1
 neighbor 10.100.0.2 remote-as 4200080001
 neighbor 10.100.0.2 description leaf-a (MLAG peer)
 neighbor SERVERS peer-group
 neighbor SERVERS remote-as 65000
 bgp listen range 10.100.0.0/24 peer-group SERVERS
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 64
  neighbor SERVERS default-originate
  neighbor SERVERS prefix-list SERVERS-OUT out
 exit-address-family
!
ip prefix-list SERVERS-OUT seq 10 permit 0.0.0.0/0
!
line vty
!
