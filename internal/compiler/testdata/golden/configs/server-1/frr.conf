frr defaults datacenter
hostname server-1
service integrated-vtysh-config
!
interface bond0
 description to rack-1 leaf pair
 ip address 10.100.0.11/24
!
router bgp 65000
 bgp router-id 10.100.0.11
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.100.0.2 remote-as 4200080001
 neighbor 10.100.0.2 description leaf-a
 neighbor 10.100.0.3 remote-as 4200080001
 neighbor 10.100.0.3 description leaf-b
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 64
 exit-address-family
!
line vty
!
